name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # GitHubのリポジトリを取得
      - name: Checkout
        uses: actions/checkout@v4

      # Haskell / Cabalをセットアップ
      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6'
          cabal-version: '3.10'

      # Cabalパッケージを更新
      - name: Cabal update
        run: cabal update

      # ビルド
      - name: Cabal build
        run: cabal build

      # プログラムを実行してHTMLを生成
      - name: Cabal run
        run: cabal run

      # GitHub Pages用のディレクトリを準備
      - name: Prepare Pages
        run: |
          mkdir -p dist
          cp index.html dist/

      # GitHub Pagesへアップロード
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      # GitHub Pagesへデプロイ
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
