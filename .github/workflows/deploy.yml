name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.4.8'
          cabal-version: '3.10'
          cabal-update: true

      - name: Build
        run: cabal build

      - name: Generate HTML
        run: cabal run

      - name: Prepare Pages
        run: |
          rm -rf dist
          mkdir -p dist
          cp index.html dist/index.html
          cp styles.css dist/styles.css
          rsync -a --exclude='.DS_Store' docs/ dist/docs/
          rsync -a --exclude='.DS_Store' logos/ dist/logos/
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
